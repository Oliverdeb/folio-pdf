name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          # Apex/custom domain: set repo variable FOLIO_BASE to /
          # Project Pages (oliverdeb.github.io/folio-pdf): leave unset
          FOLIO_BASE: ${{ vars.FOLIO_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER_SITE }}
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
